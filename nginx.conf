# ============================================================
# Nginx Config — Hostinger VPS / Mahreen Indonesia
# ============================================================
# Letakkan di: /etc/nginx/sites-available/mahreenindonesia.com
# Aktifkan: ln -s /etc/nginx/sites-available/mahreenindonesia.com /etc/nginx/sites-enabled/
# Reload:  nginx -t && systemctl reload nginx

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name mahreenindonesia.com www.mahreenindonesia.com;

    # ACME challenge untuk Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mahreenindonesia.com www.mahreenindonesia.com;

    # SSL — Let's Encrypt (auto-generated oleh Hostinger atau certbot)
    ssl_certificate     /etc/letsencrypt/live/mahreenindonesia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mahreenindonesia.com/privkey.pem;

    # SSL hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # Frontend — static files dari build Vite
    root /var/www/mahreenindonesia.com/frontend/dist;
    index index.html;

    # Uploads — serve dari backend
    location /uploads/ {
        alias /var/www/mahreenindonesia.com/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";

        # Block HTML/SVG upload untuk cegah XSS
        location ~* \.(html?|svg|xml|xhtml)$ {
            add_header Content-Disposition "attachment";
            add_header X-Content-Type-Options "nosniff";
        }
    }

    # API — proxy ke Node.js backend
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeout
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffer
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 4 32k;
    }

    # Swagger docs (optional — bisa diblock di produksi)
    location /api-docs/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE endpoint — long polling support
    location /api/newsroom/events/stream {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        chunked_transfer_encoding off;
    }

    # Client SSE endpoint — authenticated user stream
    location /api/client/stream {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        chunked_transfer_encoding off;
    }

    # SEO pre-rendered pages
    location /seo/ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # Cache untuk aset statis
    location ~* \.(js|css|png|jpe?g|gif|webp|avif|svg|woff2?|ico|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — semua route yang bukan file → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Block akses file sensitif
    location ~ /\. {
        deny all;
    }
    location ~ \.(env|log|ini|sh|sql)$ {
        deny all;
    }
}
